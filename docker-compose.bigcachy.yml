# bigcachy topology override for the lario-llms compose stack.
#
# This host (192.168.10.241, RTX 5080) runs the FLEET: bifrost, chromadb, the embedding
# service and all 9 Hermes agents. It does NOT run a model backend. The big models stay
# on l-dev-ai (192.168.10.240, Strix Halo unified memory), where native llama-swap serves
# them on :11434 behind the single external alias `main`.
#
# Usage:    cd ~/Projects/personal/lario-llms && \
#           docker compose -f docker-compose.yml -f docker-compose.bigcachy.yml \
#             up -d bifrost chromadb rag_api ml_pipeline
#           (never name `llamacpp` in the service list — the explicit -f flags
#            deliberately EXCLUDE legacy/fedora/docker-compose.override.yml)
#
# ─── Two things that differ from docker-compose.cachyos.yml ────────────────────────
#
# 1. `ollama` maps to 192.168.10.240, NOT host-gateway.
#    Bifrost's config.db holds exactly one endpoint string, `http://ollama:11434`. On
#    l-dev-ai that resolved to the local host. Here, host-gateway would resolve to THIS
#    box's ollama.service on :11434 — which is running but has no models. The stack would
#    look perfectly healthy while every completion failed. Pointing the alias at a literal
#    address keeps config.db untouched and sends traffic to the real backend.
#    The tailscale ip is used for STABLE IDENTITY (survives LAN renumbering / cable
#    changes), not speed — tailscale does not reliably pick the fastest of the available
#    paths. Measured numbers live in agents/docker-compose.yml.
#
# 2. NVIDIA, not ROCm.
#    The cachyos override passes /dev/kfd + /dev/dri and sets HSA_OVERRIDE_GFX_VERSION
#    for AMD. Here the GPU is a Blackwell RTX 5080 reached via CDI (`nvidia.com/gpu=all`,
#    generated into /etc/cdi/nvidia.yaml by nvidia-ctk). ml_env is rebuilt on a CUDA base
#    to match — see ml_env/Dockerfile.
#
# The HF cache lives on the xfs partition here (/mnt/xfs, 625G free), not on / .

services:
  bifrost:
    image: maximhq/bifrost:v1.6.3   # pin — v2.0.0 is imminent on the `latest` tag
    depends_on: []                  # the backend is remote and native
    # Replace the base file's port list. BIFROST_BIND_IP defaults to loopback; set this
    # box's tailscale IP in .env to expose on the tailnet. The Bifrost admin API has no
    # auth — keep it off the LAN.
    ports: !override
      - "127.0.0.1:8080:8080"
      - "${BIFROST_BIND_IP:-127.0.0.1}:8080:8080"
    extra_hosts:
      - "ollama:100.68.129.20"
      - "host.docker.internal:host-gateway"

  rag_api:
    extra_hosts:
      - "ollama:100.68.129.20"
      - "host.docker.internal:host-gateway"
    # bge-m3 embeddings on the RTX 5080. Requires nvidia-container-toolkit + a CDI spec
    # (`sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml`); regenerate that
    # spec after any driver upgrade or this fails with device-not-found.
    devices:
      - "nvidia.com/gpu=all"
    volumes: !override
      - ./ml_env/scripts:/app/scripts
      - /mnt/xfs/AI_Models/huggingface:/root/.cache/huggingface

  ml_pipeline:
    extra_hosts:
      - "ollama:100.68.129.20"
      - "host.docker.internal:host-gateway"
    devices:
      - "nvidia.com/gpu=all"
    volumes: !override
      - ./ml_env/scripts:/app/scripts
      - /mnt/xfs/AI_Models/huggingface:/root/.cache/huggingface
