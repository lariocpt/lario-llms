# bigcachy: native RTX CUDA + Intel GenAI; Radeon owner is mini-mobile.
# Use with docker-compose.yml and docker-compose.intel.yml. ml_pipeline is optional.
# All model storage is XFS /mnt/xfs/AI_Models. Bifrost is retired; its historical database remains ignored on disk.

services:
  rag_api:
    extra_hosts:
      - "ollama:100.68.129.20"
      - "host.docker.internal:host-gateway"
    devices: !override []
    volumes: !override
      - ./ml_env/scripts:/app/scripts
      - /mnt/xfs/AI_Models/huggingface:/root/.cache/huggingface

  ml_pipeline:
    extra_hosts:
      - "ollama:100.68.129.20"
      - "host.docker.internal:host-gateway"
    profiles: ["pipeline"]
    devices: !override []
    volumes: !override
      - ./ml_env/scripts:/app/scripts
      - /mnt/xfs/AI_Models/huggingface:/root/.cache/huggingface

  # Preserve the fleet's vision:8080 DNS endpoint; the GPU is owned by native
  # rtx5080.service. Proxying avoids stale NVIDIA CDI mounts after driver upgrades.
  vision:
    image: nginx:1.27-alpine
    container_name: vision
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./rtx5080/config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lario-net

  # Radeon inference moved to mini-mobile. The optional compatibility forwarder
  # is included by shared/compose-files.sh only after its consumer key is installed.
