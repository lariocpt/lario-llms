# CachyOS compatibility override for local container services.
# Geekom inference is native; Bifrost is retired. Do not name Bifrost in startup.
# Use explicit -f flags to exclude legacy Fedora overrides.

services:
  rag_api:
    extra_hosts:
      - "ollama:host-gateway"
      - "host.docker.internal:host-gateway"
    # GPU passthrough for containerized torch (bundles its own older ROCm, so the spoof
    # is still correct INSIDE this container even though native builds don't use it):
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0

  ml_pipeline:
    extra_hosts:
      - "ollama:host-gateway"
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
