# llama-swap config for the VISION model — runs on bigcachy's RTX 5080, NOT on l-dev-ai.
#
# Why it lives here and not with the big models: l-dev-ai's 124GB unified pool is the scarce
# resource and belongs entirely to the resident main model (70-88GB). Vision was removed from
# that box on 2026-07-26 — it was pinned at -c 16384, a quarter of the 65536 every agent asks
# for, and it competed for RAM it had no business taking. An 8B VL model fits in 16GB of
# dedicated VRAM with room to spare.
#
# This file is NOT generated — unlike llama-cpp/config.yaml (which main-model.sh rewrites),
# edit this one by hand. main-model.sh does not know about it and will not touch it.
#
# Served by the `vision` service in docker-compose.bigcachy.yml:
#   containers on lario-net : http://vision:8080/v1
#   host tools (opencode)   : http://127.0.0.1:11435/v1
#
# ttl: 900 = unload after 15 min idle, so the GPU is free for rag_api's bge-m3 embeddings
# (which needs ~2.5GB) whenever vision isn't in use. This is the "swap it in when we need it"
# behaviour — nothing is resident by default.

healthCheckTimeout: 900
logLevel: info

models:
  "qwen3-vl":
    aliases: ["visual", "vision", "image", "ollama/visual", "ollama/vision"]
    # --mmproj is fetched automatically alongside the -hf repo (the multimodal projector;
    # without it the model loads but silently ignores images).
    #
    # -c raised 16384 -> 32768 on 2026-07-26. The original 16384 was sized for "answer a
    # question about one image", and that is still all the VISION path needs. The extra
    # room is for the small auxiliary text tasks now routed here (web_extract, title
    # generation, session search) to keep them off l-dev-ai — a scraped page or a browser
    # snapshot regularly exceeds 16K, and overflowing costs an error rather than a slow
    # answer. KV for an 8B at 32K is ~1GB, which the 16GB card has beside rag_api's bge-m3.
    #
    # The original warning still stands and is NOT relaxed by this: do not point a Hermes
    # agent's `default:` at this model. 32K is for side tasks, not for a 64K agent
    # conversation.
    #
    # CORRECTION 2026-08-05: this note used to except context COMPRESSION too, on the
    # grounds that it "summarises a ~40K middle chunk and would not fit here". That was
    # wrong, and it kept compaction pinned to a model where it could not finish. Hermes'
    # own compression telemetry across every agent measures aux_prompt_tokens at
    # 1,751-3,966 and the summarised middle window at 778-5,929 — compaction protects a
    # large head and tail and only ever ships the middle to the summariser. It fits 32K
    # with an order of magnitude to spare. Measured here: a 4,376-token compaction prompt
    # answered in 2.6s, against 600s-and-a-timeout on `main`. Compaction is now routed
    # here via auxiliary.compression in every agent's config.src.yaml.
    # KV quantised to q8_0 on 2026-08-01. The -c 16384 -> 32768 raise above assumed
    # "KV for an 8B at 32K is ~1GB"; the real f16 allocation is 4608 MiB, and the card
    # could not fit it beside rag_api's bge-m3 (measured at 4.0-4.3GB resident, not the
    # ~2.5GB assumed here — SentenceTransformer loads bge-m3 in fp32). llama-server died
    # on startup with "cudaMalloc failed: out of memory ... failed to allocate buffer for
    # kv cache", which llama-swap surfaces only as "upstream command exited prematurely",
    # so every image call returned a 500 with no hint of the real cause. q8_0 halves KV to
    # ~2.3GB, which fits. Verified end-to-end: 64px and 1920x1080 images both answered.
    #
    # q8_0 alone left almost nothing spare — a 1080p image peaked at 89 MiB free of 16303,
    # and n_slots is 4 with all four aux tasks (vision, web_extract, title_generation,
    # session_search) routed here, so concurrent large requests would still have OOM'd at
    # runtime. Loading bge-m3 in fp16 in the same commit (ml_env/scripts/rag_api.py) freed
    # ~2.7GB and is what makes this configuration actually safe: the same 1080p request now
    # bottoms out at 2984 MiB free. Both halves are load-bearing — reverting either one puts
    # this back under the limit.
    #
    # --image-max-tokens 2048 added 2026-08-05, and it is what makes the headroom above
    # actually hold. The 1080p measurement that sized this was not the worst case: image
    # tokens scale with PIXELS, and a real product image off muscledynamix.co.za is
    # 2334x3157 = 7.4MP, ~6x a 1080p frame and ~9,400 image tokens. Decoding it OOM'd the
    # encoder mid-request and SIGABRT'd the server:
    #
    #   CUDA error: out of memory / cuMemCreate(&handle, reserve_size, &prop, 0)
    #   ggml_cuda_pool_vmm::alloc <- ggml_cuda_mul_mat_q <- mtmd_helper_decode_image_chunk
    #
    # Note this is a RUNTIME crash, not the startup failure the block above describes, so
    # it presents differently: llama-swap logs "upstream exited unexpectedly" (not
    # "upstream command exited prematurely"), the container healthcheck stays green, and
    # the agent sees only a 502. scripts/vision-monitor.sh scans for the startup string
    # and does NOT catch this one.
    #
    # A token cap is the right lever rather than more VRAM: it bounds the encoder
    # allocation for ANY input image, so no future 12MP phone photo can reproduce this.
    # 2048 is 2x the 1024 floor llama.cpp warns Qwen-VL needs for grounding accuracy.
    # Verified: the same 7.4MP label that crashed the server now reads back correctly.
    cmd: |
      /app/llama-server --host 0.0.0.0 --port ${PORT}
      -hf unsloth/Qwen3-VL-8B-Instruct-GGUF:Q4_K_M
      -ngl 999 -c 32768 -fa on --jinja --no-warmup
      -ctk q8_0 -ctv q8_0
      --image-max-tokens 2048
    ttl: 900
