# llama-xmx-config.yaml — llama.cpp config for Intel XMX GPU offload
# Qwen3.8-Flash-Next UD-Q3_K_XL with Intel XMX GPU offload
# Models loaded from /models/gguf/qwen38-flash/ (local files)

# Model configuration
model:
  path: "/models/gguf/qwen38-flash/Qwen3.8-Flash-Next-UD-Q3_K_XL-00001-of-00003.gguf"
  # Use -m with first shard; llama.cpp follows "Next file" header for other shards

# Model loading
model_loading:
  # Offload to Intel GPU via XMX (requires -DGGML_INTEL_XMX=ON build)
  n_gpu_layers: 999          # Offload all possible layers to GPU
  split_mode: "layer"        # Split layers across devices
  main_gpu: 0                # Primary GPU device
  tensor_split: null         # Single GPU

# Offload configuration
offload:
  # CPU MoE offload: keep all MoE expert weights on CPU
  cpu_moe: true
  # Pin n-gram embedding table to CPU (26.9 GiB PLE table)
  override_tensor:
    per_layer_token_embd: "CPU"

# Context and parallelism
context:
  n_ctx: 524288              # 4 * 131072 total context
  n_parallel: 4              # 4 parallel slots
  n_batch: 2048
  n_ubatch: 512

# KV cache
kv_cache:
  type_k: "q8_0"
  type_v: "q8_0"
  cache_ram: false           # KV in VRAM (not system RAM)
  unified: false

# Performance
performance:
  threads: 24                # All 24 logical cores (Core Ultra 285K: 8P+16E)
  threads_batch: 24
  n_gqa: 4                   # Grouped-query attention
  flash_attn: true           # Flash attention
  no_kv_offload: false

# Sampling (Qwen3.8 thinking mode)
sampling:
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  repeat_penalty: 1.0
  presence_penalty: 0.0
  frequency_penalty: 1.0
  reasoning_budget: 2048     # Reasoning token budget

# MTP (Multi-Token Prediction) - optional, requires fork build
# mtp:
#   enabled: true
#   n_predict: 5

# Server
server:
  host: "::"
  port: 8080
  n_parallel: 4
  n_ctx_slot: 131072
  concurrency_limit: 4
  cache_ram: 0
  jinja: true
  ttl: 0

# Logging
log:
  level: "info"
  format: "text"
