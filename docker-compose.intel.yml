# docker-compose.intel.yml — Intel-optimized AI stack for bigcachy
# 
# Adds IPEX (CPU+XPU), OpenVINO GenAI (NPU/GPU), and specialized services
# for embedding, ASR, translation, TTS running on NPU/iGPU/CPU.
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.bigcachy.yml -f docker-compose.intel.yml up -d
#
# Requires: Intel GPU (Xe-LPG iGPU), NPU (Core Ultra 285K), 
# docker-compose v2.20+, Intel GPU drivers, OpenCL/ICD loaders.
#
# Network: joins lario-net; reaches agent-llm:8080, vision:8080, bifrost:8080
# Models: reads from /mnt/xfs/AI_Models (mounted ro)

services:
  # ─── rag_api: Override bigcachy GPU devices (embeddings now on Intel CPU) ──────
  rag_api:
    devices: !override []
    environment:
      INTEL_EMBED_URL: "http://intel-embedding:8001"
    depends_on:
      - intel-embedding
      - chromadb

  # ─── ipex-server: Intel Extension for PyTorch (CPU + XPU) ────────────────────
  ipex-server:
    image: intel/extension-for-pytorch:2.5.0-xpu
    container_name: ipex-server
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    volumes:
      - /mnt/xfs/AI_Models:/models:ro
      - /mnt/xfs/AI_Models/huggingface:/root/.cache/huggingface:ro
      - ./ml_env/scripts:/app/scripts:ro
      - ./intel/ipex_server:/app:ro
    environment:
      - PYTORCH_XPU_MEMORY_FRACTION=0.85
      - SYCL_CACHE_PERSISTENT=1
      - ZE_AFFINITY_MASK=0
      - ZES_ENABLE_SYSMAN=1
      - OMP_NUM_THREADS=24
      - MKL_NUM_THREADS=24
      - IPEX_XPU_ONEDNN_LAYOUT=NHWC
    ports:
      - "127.0.0.1:8081:8081"
    entrypoint: ["/bin/bash", "-c", "exec python -m uvicorn app:app --host 0.0.0.0 --port 8081"]
    restart: unless-stopped
    networks:
      - lario-net

  # ─── openvino-genai: OpenVINO GenAI (NPU/GPU) ───────────────────────────────
  openvino-genai:
    image: openvino/genai:2025.1.0
    container_name: openvino-genai
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    volumes:
      - /mnt/xfs/AI_Models:/models:ro
      - /mnt/xfs/AI_Models/huggingface:/root/.cache/huggingface:ro
      - ./intel/openvino_genai:/app:ro
    environment:
      - OPENVINO_DEVICE=NPU
      - OPENVINO_GPU_DEVICE=0
      - OPENVINO_NPU_DEVICE=0
      - OPENVINO_LOG_LEVEL=INFO
      - OMP_NUM_THREADS=24
    ports:
      - "127.0.0.1:8082:8082"
    entrypoint: ["/bin/bash", "-c", "exec python -m uvicorn app:app --host 0.0.0.0 --port 8082"]
    restart: unless-stopped
    networks:
      - lario-net

  # ─── intel-embedding: Text Embeddings on CPU -> GPU.0 ─────────────────────────
  intel-embedding:
    build:
      context: ./intel/services/embedding
      dockerfile: Dockerfile
    container_name: intel-embedding
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    volumes:
      - /mnt/xfs/AI_Models/openvino:/models:ro
      - /mnt/xfs/AI_Models/huggingface:/root/.cache/huggingface:ro
    environment:
      - EMBEDDING_MODEL_DIR=/models/embeddings/e5-base-v2-int8
      - EMBEDDING_BATCH_SIZE=32
      - EMBEDDING_MAX_SEQ_LEN=512
      - OMP_NUM_THREADS=24
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    networks:
      - lario-net

  # ─── intel-asr: Speech-to-Text on iGPU (encoder) + CPU (decoder) ─────────────
  intel-asr:
    build:
      context: ./intel/services/asr
      dockerfile: Dockerfile
    container_name: intel-asr
    profiles: ["asr"]
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    volumes:
      - /mnt/xfs/AI_Models/openvino:/models:ro
      - /mnt/xfs/AI_Models/huggingface:/root/.cache/huggingface:ro
    environment:
      - ASR_MODEL_DIR=/models/asr/distil-whisper-large-v3-int8
      - ASR_ENCODER_DEVICE=GPU.0
      - ASR_DECODER_DEVICE=CPU
      - OMP_NUM_THREADS=24
    ports:
      - "127.0.0.1:8002:8002"
    restart: unless-stopped
    networks:
      - lario-net

  # ─── intel-translation: Translation on CPU ───────────────────────────────────
  intel-translation:
    build:
      context: ./intel/services/translation
      dockerfile: Dockerfile
    container_name: intel-translation
    profiles: ["translation"]
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    volumes:
      - /mnt/xfs/AI_Models/openvino:/models:ro
      - /mnt/xfs/AI_Models/huggingface:/root/.cache/huggingface:ro
    environment:
      - TRANSLATION_MODEL_DIR=/models/translation/nllb-200-distilled-600m-int8
      - TRANSLATION_DEVICE=CPU
      - OMP_NUM_THREADS=24
    ports:
      - "127.0.0.1:8003:8003"
    restart: unless-stopped
    networks:
      - lario-net

  # ─── intel-tts: Text-to-Speech on iGPU ───────────────────────────────────────
  intel-tts:
    build:
      context: ./intel/services/tts
      dockerfile: Dockerfile
    container_name: intel-tts
    profiles: ["tts"]
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    volumes:
      - /mnt/xfs/AI_Models/openvino:/models:ro
      - /mnt/xfs/AI_Models/huggingface:/root/.cache/huggingface:ro
    environment:
      - TTS_MODEL_DIR=/models/tts/kokoro-82m-int8
      - TTS_DEVICE=GPU.0
      - OMP_NUM_THREADS=24
    ports:
      - "127.0.0.1:8004:8004"
    restart: unless-stopped
    networks:
      - lario-net

  # ─── intel-gateway: Unified API Gateway ──────────────────────────────────────
  intel-gateway:
    build:
      context: ./intel/services/gateway
      dockerfile: Dockerfile
    container_name: intel-gateway
    profiles: ["gateway"]
    volumes:
      - ./intel/services/gateway:/app:ro
    environment:
      - EMBEDDING_URL=http://intel-embedding:8001
      - ASR_URL=http://intel-asr:8002
      - TRANSLATION_URL=http://intel-translation:8003
      - TTS_URL=http://intel-tts:8004
      - OMP_NUM_THREADS=24
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - lario-net
    depends_on:
      - intel-embedding
      - intel-asr
      - intel-translation
      - intel-tts

  # ─── llama-xmx: llama.cpp with Intel XMX GPU offload ─────────────────────────
  llama-xmx:
    build:
      context: ./llama-cpp
      dockerfile: Dockerfile.intel-xmx
    container_name: llama-xmx
    profiles: ["intel-xmx"]
    entrypoint: ["/usr/local/bin/llama-swap", "-config", "/config/llama-xmx-config.yaml", "-listen", ":8080"]
    restart: unless-stopped
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - ${HOME}/.local/bin/llama-swap:/usr/local/bin/llama-swap:ro
      - ./llama-cpp/llama-xmx-config.yaml:/config/llama-xmx-config.yaml:ro
      - /mnt/xfs/AI_Models:/models:ro
      - /mnt/xfs/AI_Models/llama.cpp-cache:/root/.cache/llama.cpp
      - /usr/share/libdrm:/usr/share/libdrm:ro
    ports:
      - "127.0.0.1:8083:8080"
      - "${AGENT_LLM_BIND_DIRECT:-127.0.0.2}:8083:8080"
      - "${AGENT_LLM_BIND_LAN:-127.0.0.3}:8083:8080"
      - "${AGENT_LLM_BIND_TS:-127.0.0.4}:8083:8080"
    environment:
      - LLAMA_CACHE=/root/.cache/llama.cpp
    networks:
      - lario-net

  # ─── intel-gpu-monitor: Intel GPU / NPU telemetry ────────────────────────────
  intel-gpu-monitor:
    image: intel/intel-gpu-monitor:latest
    container_name: intel-gpu-monitor
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    volumes:
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
    environment:
      - UPDATE_INTERVAL=5
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - lario-net

  # ─── openvino-benchmark: NPU/GPU/CPU benchmark ───────────────────────────────
  openvino-benchmark:
    image: openvino/genai:2025.1.0
    container_name: openvino-benchmark
    profiles: ["benchmark"]
    devices:
      - "/dev/dri:/dev/dri"
      - "/dev/accel:/dev/accel"
    volumes:
      - /mnt/xfs/AI_Models:/models:ro
      - /mnt/xfs/AI_Models/openvino:/models/ov:ro
      - ./intel/benchmarks:/app:ro
    environment:
      - OPENVINO_DEVICE=NPU
      - OPENVINO_GPU_DEVICE=0
      - OPENVINO_NPU_DEVICE=0
    entrypoint: ["/bin/bash", "-c", "cd /app && python benchmark.py"]
    networks:
      - lario-net

networks:
  lario-net:
    external: true
