# Intel services run natively under systemd so GenAI can use the host's Intel
# compute/NPU drivers. No Intel chat alias or extra GPU-serving framework.
# Install: intel/install.sh. See intel/README.md for measured device placement.
services:
  rag_api:
    devices: !override []
    environment:
      INTEL_EMBED_URL: http://host.docker.internal:8001
      DEFAULT_EMBED_MODEL: BAAI/bge-m3
    extra_hosts:
      - host.docker.internal:host-gateway
