# docker-compose.yml — lario-llms base stack
#
# This is the portable baseline. Host-specific overrides live in
# docker-compose.bigcachy.yml (this machine) and docker-compose.cachyos.yml (l-dev-ai).
# Intel-specific services are in docker-compose.intel.yml.
#
# Run everything with:
#   docker compose -f docker-compose.yml -f docker-compose.bigcachy.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.bigcachy.yml -f docker-compose.intel.yml up -d

services:
  # ─── ChromaDB: Vector database for RAG ──────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - lario-net

  # ─── rag_api: RAG query/ingest (uses Intel embedding service) ────────────────
  rag_api:
    build:
      context: ./ml_env
      dockerfile: Dockerfile.cpu
    container_name: rag_api
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./ml_env/scripts:/app/scripts
      - /mnt/AI_Models/huggingface:/root/.cache/huggingface
    command: python /app/scripts/rag_api.py
    environment:
      LLM_API_URL: "http://${LLM_HOST_IP:-192.168.2.1}:11434/v1"
      INTEL_EMBED_URL: "http://intel-embedding:8001"
    depends_on:
      - chromadb
    restart: unless-stopped
    networks:
      - lario-net

  # ─── ml_pipeline: Background ML jobs ────────────────────────────────────────
  ml_pipeline:
    build:
      context: ./ml_env
      dockerfile: Dockerfile
    container_name: ml_pipeline
    volumes:
      - ./ml_env/scripts:/app/scripts
      - /mnt/AI_Models/huggingface:/root/.cache/huggingface
    command: tail -f /dev/null
    restart: unless-stopped
    networks:
      - lario-net

  # ─── bifrost: LLM inference (Qwen3.6-27B on RTX 5080) ───────────────────────
  bifrost:
    build:
      context: ./llama-cpp
      dockerfile: Dockerfile
    container_name: bifrost
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - ${HOME}/.local/bin/llama-swap:/usr/local/bin/llama-swap:ro
      - ./llama-cpp/bifrost-config.yaml:/config/bifrost-config.yaml:ro
      - /mnt/AI_Models:/models:ro
      - /mnt/AI_Models/llama.cpp-cache:/root/.cache/llama.cpp
      - /usr/share/libdrm:/usr/share/libdrm:ro
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - LLAMA_CACHE=/root/.cache/llama.cpp
    networks:
      - lario-net

networks:
  lario-net:
    external: true
